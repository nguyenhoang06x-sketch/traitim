<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a0824">
  <title>Tim Hạt ♥</title>

  <!-- Toàn bộ CSS nằm ở file riêng -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 0. Quầng sáng hồng sau trái tim (JS cho "thở" theo nhịp đập) -->
  <div id="glow" class="glow" aria-hidden="true"></div>

  <!-- 1. Canvas full màn hình: Three.js vẽ trái tim hạt vào đây -->
  <canvas id="scene"></canvas>

  <!-- 2. Thông báo nhỏ (chỉ dùng khi không tải được Three.js) -->
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <!-- 3. MỘT bài nhạc duy nhất, phát lặp vô hạn, TỰ PHÁT ở lần chạm đầu tiên -->
  <audio id="player" src="music/song.mp3" loop preload="auto" hidden></audio>

  <!-- 4. Three.js r128 từ CDN — BẮT BUỘC đặt TRƯỚC script.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- 5. Toàn bộ logic của trang -->
  <script src="script.js"></script>
</body>
</html>
